<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ============================================================
   CRADL — read the game. Pick a phase, play clips in it.
   You commit a read cold, then see the play resolve (PREDICT,
   the one with a real outcome) and where the room landed
   (DIAGNOSE / ADJUST — no right answer; the split is the point).
   Terminology aligned to standard USA Lacrosse usage.
   Distributions are SEEDED/illustrative; only your own answer
   is real until a backend collects responses. Clips below are
   PLACEHOLDERS — replace with your own filmed reads.
   ============================================================ */

const PALETTE = {
  bg: "#0c0e0d", panel: "#15181a", panel2: "#1c2023", line: "#2b3034",
  ink: "#eef2ee", mute: "#7d8a82", acid: "#c8f032", amber: "#f0a832",
  red: "#e6553f", blue: "#6fa8ff", teal: "#5ad1c4", purple: "#9b8cf0",
};
const DISPLAY = "'Bebas Neue', 'Arial Narrow', sans-serif";
const BODY = "'Spline Sans', system-ui, sans-serif";

const CATS = [
  { key: "OFFENSE", label: "Offense", color: "#c8f032" },
  { key: "DEFENSE", label: "Defense", color: "#6fa8ff" },
  { key: "TRANSITION", label: "Transition", color: "#9b8cf0" },
  { key: "GOALIE", label: "Goalie", color: "#5ad1c4" },
  { key: "FACEOFF", label: "Faceoff", color: "#f0a832" },
  { key: "MANUP", label: "Man-Up / Down", color: "#e6553f" },
];
const catColor = (k) => (CATS.find((c) => c.key === k) || {}).color || PALETTE.acid;
const catLabel = (k) => (CATS.find((c) => c.key === k) || {}).label || k;

const Ico = ({ children, size = 16, style, className }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style} className={className}>{children}</svg>
);
const ChevronRight = (p) => <Ico {...p}><path d="m9 18 6-6-6-6" /></Ico>;
const ArrowLeft = (p) => <Ico {...p}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></Ico>;
const Check = (p) => <Ico {...p}><path d="M20 6 9 17l-5-5" /></Ico>;
const Crosshair = (p) => <Ico {...p}><circle cx="12" cy="12" r="10" /><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4" /></Ico>;
const Share = (p) => <Ico {...p}><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5" /></Ico>;
const MessageBox = (p) => <Ico {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></Ico>;

/* ---------- clip pool (PLACEHOLDERS — real terms, fake film) ---------- */
const CLIPS = [
  {
    id: "off1", category: "OFFENSE", title: "Two-man game on the wing, settled",
    context: { score: "Tied", time: "6:20 / 2Q", manpower: "Settled 6v6" }, video: "",
    predict: { text: "How does this possession end?", options: ["Goal", "Save", "Caused turnover", "Shot off-cage", "Reset to X"], field: [16, 13, 9, 7, 15] },
    diagnose: { text: "Key factor on the rep?", options: ["Dodge angle / top-side", "Pick timing", "Off-ball spacing", "Feed read", "Shooter selection"], field: [18, 21, 12, 9, 8] },
    adjust: { text: "Right adjustment?", options: ["Slip the pick", "Re-dodge from X", "Skip to weakside", "Invert the matchup", "Move it, reset"], field: [15, 12, 17, 14, 6] },
    outcome: { actual: 0, summary: "Slip after the hedge, feed to the inside cutter for a quick stick; goal.", process: "SOUND" },
  },
  {
    id: "def1", category: "DEFENSE", title: "Unsettled defense, fast break 4v3",
    context: { score: "Tied", time: "8:15 / 3Q", manpower: "4v3 against" }, video: "",
    predict: { text: "How does the sequence end?", options: ["Stop / clear", "Goal against", "Save", "Shot off-cage", "Caused turnover"], field: [14, 17, 11, 5, 9] },
    diagnose: { text: "Key factor?", options: ["First-slide timing", "Second slide / \"you're hot\"", "Recovery", "Crease coverage", "Top-side angle"], field: [21, 16, 8, 6, 5] },
    adjust: { text: "Right adjustment?", options: ["Slide earlier", "Play the box / triangle", "Take away the crease", "Force the low shot", "Match the ball faster"], field: [13, 9, 18, 14, 4] },
    outcome: { actual: 4, summary: "Early slide and a hard recovery force a contested skip; thrown away.", process: "SOUND" },
  },
  {
    id: "trn1", category: "TRANSITION", title: "Broken clear vs. 10-man ride, 4Q",
    context: { score: "Down 1", time: "2:40 / 4Q", manpower: "Ride on" }, video: "",
    predict: { text: "What happens on the clear?", options: ["Clean clear", "Turnover vs. the ride", "Shot against off the turnover", "Sub / reset", "Gilman / send it"], field: [10, 29, 7, 8, 6] },
    diagnose: { text: "Key factor?", options: ["Ride pressure", "Outlet / break support", "Spacing on the break", "Goalie's outlet read", "Numbers"], field: [20, 18, 11, 6, 5] },
    adjust: { text: "Right adjustment?", options: ["Change the clear", "Outlet to the sideline", "Gilman it", "Sub fresh legs", "Hold and reset"], field: [22, 15, 10, 9, 4] },
    outcome: { actual: 1, summary: "Pressured turnover at midline; the sideline outlet was open but never used.", process: "DEFENSIBLE" },
  },
  {
    id: "gk1", category: "GOALIE", title: "Save and outlet under ride pressure",
    context: { score: "Up 1", time: "4:05 / 4Q", manpower: "Ride on" }, video: "",
    predict: { text: "What happens after the save?", options: ["Clean outlet to a break", "Held / forced reset", "Turnover on the clear", "Gilman clear", "Stuck behind"], field: [17, 14, 12, 9, 6] },
    diagnose: { text: "Key factor?", options: ["Outlet / first look", "Check-up communication", "Arc & positioning", "Footwork to the ball", "Ride recognition"], field: [19, 17, 10, 8, 7] },
    adjust: { text: "Right adjustment?", options: ["Hit the breaking middie", "Outlet to sideline D", "Gilman it", "Reset behind", "Hold, take a timeout"], field: [16, 18, 11, 9, 4] },
    outcome: { actual: 0, summary: "Outlet to the strong-side break beats the first wave of the ride; numbers up.", process: "SOUND" },
  },
  {
    id: "fo1", category: "FACEOFF", title: "Faceoff at X, even strength",
    context: { score: "Tied", time: "Start / 2Q", manpower: "Even" }, video: "",
    predict: { text: "How does the faceoff resolve?", options: ["Clean win to a break", "Win held / GB scrum", "Loss (clamp beaten)", "Violation", "Win, then turned over"], field: [15, 19, 14, 6, 7] },
    diagnose: { text: "Key factor?", options: ["Clamp vs. counter", "Hand speed off whistle", "Exit direction", "Wing support / GBs", "Body position"], field: [20, 16, 12, 11, 6] },
    adjust: { text: "Right adjustment?", options: ["Counter the clamp (jump)", "Fast exit to the wing", "Win to space / clear", "Tie up for the wings", "Change the move"], field: [17, 18, 10, 12, 5] },
    outcome: { actual: 0, summary: "Clamp won, fast exit to the open wing; straight into numbers in transition.", process: "SOUND" },
  },
  {
    id: "mu1", category: "MANUP", title: "Extra-man offense (6v5), 1:10 left",
    context: { score: "Down 2", time: "1:10 / 4Q", manpower: "EMO 6v5" }, video: "",
    predict: { text: "How does the EMO possession end?", options: ["Goal", "Save", "Caused turnover", "Shot off-cage", "Reset for last look"], field: [18, 12, 9, 7, 21] },
    diagnose: { text: "Key factor?", options: ["Ball-movement tempo", "Off-ball spacing", "Pipe presence", "MDD slide read", "Shooter selection"], field: [12, 23, 9, 14, 9] },
    adjust: { text: "Right adjustment?", options: ["Skip earlier", "Invert the set", "Plant a pipe / screen", "Slow tempo, reset", "Iso the mismatch"], field: [11, 18, 16, 13, 8] },
    outcome: { actual: 0, summary: "Skip after the man-down rotation slides; weakside finish for the goal.", process: "SOUND" },
  },
];

/* ---------- math ---------- */
function share(counts, idx) { const N = counts.reduce((a, b) => a + b, 0); return N ? counts[idx] / N : 0; }
function topShare(counts) { const N = counts.reduce((a, b) => a + b, 0); return N ? Math.max.apply(null, counts) / N : 0; }
function positionFor(counts, idx) {
  const s = share(counts, idx);
  const isModal = counts[idx] === Math.max.apply(null, counts);
  if (topShare(counts) < 0.45) return { key: "split", label: "SPLIT CALL", color: PALETTE.amber, glyph: "🟧", note: "room is divided", minority: true };
  if (isModal) return { key: "with", label: "WITH THE ROOM", color: PALETTE.acid, glyph: "🟩", note: Math.round(s * 100) + "% with you", minority: false };
  return { key: "minority", label: "MINORITY READ", color: PALETTE.blue, glyph: "🟦", note: "only " + Math.round(s * 100) + "% with you", minority: true };
}
function videoEmbed(url) {
  if (!url || typeof url !== "string") return { type: "none" };
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) return { type: "youtube", src: "https://www.youtube.com/embed/" + yt[1] };
  if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url)) return { type: "file", src: url };
  return { type: "iframe", src: url };
}

/* ---------- atoms ---------- */
const Tag = ({ cat }) => (
  <span style={{ fontFamily: DISPLAY, letterSpacing: "0.06em", color: PALETTE.bg, background: catColor(cat) }}
    className="px-2 py-0.5 text-sm">{catLabel(cat)}</span>
);

function DistBar({ options, counts, highlight, actual }) {
  const N = counts.reduce((a, b) => a + b, 0);
  return (
    <div className="space-y-1.5">
      {options.map((opt, i) => {
        const pct = N ? Math.round((counts[i] / N) * 100) : 0;
        const isPick = i === highlight; const isActual = i === actual;
        return (
          <div key={i} className="flex items-center gap-3">
            <div className="w-44 shrink-0 text-sm flex items-center gap-1.5" style={{ color: isActual ? PALETTE.acid : isPick ? PALETTE.ink : PALETTE.mute }}>
              {isActual && <Check size={13} style={{ color: PALETTE.acid }} />}{opt}
            </div>
            <div className="flex-1 h-5 relative" style={{ background: PALETTE.panel2 }}>
              <div className="h-full" style={{ width: pct + "%", background: isActual ? PALETTE.acid : isPick ? PALETTE.blue : PALETTE.line }} />
              <span className="absolute right-1.5 top-0 text-xs leading-5" style={{ color: PALETTE.mute }}>{pct}%</span>
            </div>
            {isPick && <span className="text-xs shrink-0" style={{ color: isActual ? PALETTE.acid : PALETTE.blue, fontFamily: DISPLAY }}>YOU</span>}
          </div>
        );
      })}
    </div>
  );
}

/* ---------- category picker ---------- */
function Phases({ onPick }) {
  return (
    <div>
      <div className="text-xs uppercase tracking-widest mb-3" style={{ color: PALETTE.mute }}>Pick a phase</div>
      <div className="grid grid-cols-2 gap-3">
        {CATS.map((c) => {
          const n = CLIPS.filter((cl) => cl.category === c.key).length;
          return (
            <button key={c.key} onClick={() => onPick(c.key)}
              style={{ background: PALETTE.panel, borderColor: PALETTE.line, borderLeft: "3px solid " + c.color }}
              className="border p-4 text-left">
              <div style={{ fontFamily: DISPLAY, color: c.color }} className="text-2xl tracking-wide leading-none">{c.label}</div>
              <div className="text-xs mt-1" style={{ color: PALETTE.mute }}>{n} clip{n === 1 ? "" : "s"}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- clip list within a phase ---------- */
function ClipList({ cat, onOpen, picks }) {
  const clips = CLIPS.filter((c) => c.category === cat);
  return (
    <div className="space-y-3">
      {clips.map((clip) => (
        <button key={clip.id} onClick={() => onOpen(clip.id)}
          style={{ background: PALETTE.panel, borderColor: PALETTE.line }}
          className="border w-full p-4 text-left flex items-center gap-3">
          <div className="flex-1 min-w-0">
            <div style={{ color: PALETTE.ink }} className="truncate">{clip.title}</div>
            <div className="text-xs mt-0.5" style={{ color: PALETTE.mute }}>{clip.context.score} · {clip.context.time} · {clip.context.manpower}</div>
          </div>
          {picks[clip.id] && <span className="text-xs flex items-center gap-1" style={{ color: PALETTE.acid }}><Check size={12} />read</span>}
          <ChevronRight size={18} style={{ color: PALETTE.mute }} />
        </button>
      ))}
      <p className="text-xs pt-1" style={{ color: PALETTE.mute }}>These are placeholders with real terminology — swap in your own film.</p>
    </div>
  );
}

/* ---------- the read ---------- */
function Read({ clip, onComplete }) {
  const [predict, setPredict] = useState(null);
  const [confidence, setConfidence] = useState(3);
  const [diagnose, setDiagnose] = useState(null);
  const [adjust, setAdjust] = useState(null);
  const ready = predict !== null && diagnose !== null && adjust !== null;
  const vid = videoEmbed(clip.video);

  const Step = ({ n, label, prompt, value, setValue }) => (
    <div style={{ borderColor: PALETTE.line }} className="border p-4">
      <div className="flex items-center gap-2 mb-2">
        <span style={{ fontFamily: DISPLAY, background: PALETTE.acid, color: PALETTE.bg }} className="px-2 text-sm">{n}</span>
        <span className="text-xs uppercase tracking-widest" style={{ color: PALETTE.mute }}>{label}</span>
      </div>
      <div className="mb-3" style={{ color: PALETTE.ink }}>{prompt.text}</div>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
        {prompt.options.map((opt, i) => {
          const sel = value === i;
          return (
            <button key={i} onClick={() => setValue(i)}
              style={{ borderColor: sel ? PALETTE.acid : PALETTE.line, background: sel ? PALETTE.panel2 : "transparent", color: sel ? PALETTE.acid : PALETTE.ink }}
              className="border px-3 py-2 text-left text-sm flex items-center justify-between">
              <span>{opt}</span>{sel && <Check size={15} />}
            </button>
          );
        })}
      </div>
    </div>
  );

  return (
    <div className="space-y-4">
      <div className="flex items-center gap-3">
        <Tag cat={clip.category} />
        <h2 style={{ fontFamily: DISPLAY, color: PALETTE.ink }} className="text-2xl tracking-wide">{clip.title}</h2>
      </div>
      <div style={{ background: "#000", borderColor: PALETTE.line }} className="border aspect-video relative overflow-hidden">
        {vid.type === "youtube" || vid.type === "iframe"
          ? <iframe src={vid.src} className="w-full h-full" style={{ border: 0 }} allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowFullScreen title={clip.title} />
          : vid.type === "file"
            ? <video src={vid.src} controls className="w-full h-full" style={{ objectFit: "contain", background: "#000" }} />
            : <div className="w-full h-full flex items-center justify-center"><Crosshair size={40} style={{ color: PALETTE.line }} /></div>}
        <div className="absolute bottom-2 left-2 flex gap-3 text-xs pointer-events-none" style={{ color: PALETTE.mute }}>
          <span>{clip.context.score}</span><span>{clip.context.time}</span><span>{clip.context.manpower}</span>
        </div>
      </div>

      <Step n={1} label="Predict" prompt={clip.predict} value={predict} setValue={setPredict} />
      {predict !== null && (
        <div style={{ borderColor: PALETTE.line }} className="border p-4">
          <div className="text-xs uppercase tracking-widest mb-2" style={{ color: PALETTE.mute }}>How sure?</div>
          <div className="flex gap-2">
            {[1, 2, 3, 4, 5].map((c) => (
              <button key={c} onClick={() => setConfidence(c)}
                style={{ borderColor: confidence === c ? PALETTE.acid : PALETTE.line, color: confidence === c ? PALETTE.acid : PALETTE.mute, fontFamily: DISPLAY }}
                className="border w-10 h-10 text-xl">{c}</button>
            ))}
          </div>
        </div>
      )}
      <Step n={2} label="Diagnose" prompt={clip.diagnose} value={diagnose} setValue={setDiagnose} />
      <Step n={3} label="Adjust" prompt={clip.adjust} value={adjust} setValue={setAdjust} />

      <button disabled={!ready} onClick={() => onComplete({ predict, confidence, diagnose, adjust })}
        style={{ background: ready ? PALETTE.acid : PALETTE.line, color: PALETTE.bg, fontFamily: DISPLAY }}
        className="w-full py-3 text-xl tracking-widest flex items-center justify-center gap-2">
        LOCK IN <ChevronRight size={20} />
      </button>
      <p className="text-xs text-center" style={{ color: PALETTE.mute }}>You see the room only after you lock in.</p>
    </div>
  );
}

/* ---------- reveal ---------- */
function Reveal({ clip, pick, onShare, onBack }) {
  const matched = pick.predict === clip.outcome.actual;
  const rows = [
    { label: "Diagnose", prompt: clip.diagnose, choice: pick.diagnose, pos: positionFor(clip.diagnose.field, pick.diagnose) },
    { label: "Adjust", prompt: clip.adjust, choice: pick.adjust, pos: positionFor(clip.adjust.field, pick.adjust) },
  ];
  return (
    <div className="space-y-5">
      <div>
        <div style={{ fontFamily: DISPLAY, color: PALETTE.acid }} className="text-xl tracking-wider mb-1">THE PLAY RESOLVED</div>
        <div style={{ background: PALETTE.panel, borderColor: PALETTE.line }} className="border p-4">
          <div className="flex items-center gap-2 mb-1">
            <span className="text-xs uppercase tracking-widest" style={{ color: PALETTE.mute }}>Predict</span>
            <span style={{ fontFamily: DISPLAY, color: clip.outcome.process === "SOUND" ? PALETTE.acid : PALETTE.amber }} className="ml-auto text-sm tracking-wide">PROCESS: {clip.outcome.process}</span>
          </div>
          <div className="text-sm mb-3" style={{ color: PALETTE.ink }}>{clip.outcome.summary}</div>
          <DistBar options={clip.predict.options} counts={clip.predict.field} highlight={pick.predict} actual={clip.outcome.actual} />
          <div className="text-xs mt-2" style={{ color: PALETTE.mute }}>{matched ? "You read it right — one noisy possession; skill is a season-long stat." : "You missed it — a sound read can still lose a possession."}</div>
        </div>
      </div>

      <div>
        <div style={{ fontFamily: DISPLAY, color: PALETTE.blue }} className="text-xl tracking-wider mb-1">WHERE THE ROOM SPLIT</div>
        {rows.map((r) => (
          <div key={r.label} className="mb-4">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-xs uppercase tracking-widest" style={{ color: PALETTE.mute }}>{r.label}</span>
              <span style={{ color: r.pos.color, fontFamily: DISPLAY }} className="text-sm tracking-wide ml-1">{r.pos.glyph} {r.pos.label}</span>
              <span className="text-xs ml-auto" style={{ color: PALETTE.mute }}>{r.pos.note}</span>
            </div>
            <DistBar options={r.prompt.options} counts={r.prompt.field} highlight={r.choice} actual={-1} />
            {r.pos.minority && (
              <div className="flex items-start gap-1.5 mt-2 text-sm p-2" style={{ color: PALETTE.blue, background: PALETTE.panel2 }}>
                <MessageBox size={14} className="mt-0.5 shrink-0" /> Against the grain. Could you defend this read out loud?
              </div>
            )}
          </div>
        ))}
      </div>

      <div className="flex gap-2">
        <button onClick={onShare} style={{ borderColor: PALETTE.acid, color: PALETTE.acid, fontFamily: DISPLAY }} className="flex-1 py-3 border text-lg tracking-widest flex items-center justify-center gap-2"><Share size={17} /> SHARE</button>
        <button onClick={onBack} style={{ background: PALETTE.acid, color: PALETTE.bg, fontFamily: DISPLAY }} className="flex-1 py-3 text-lg tracking-widest">MORE CLIPS</button>
      </div>
    </div>
  );
}

function shareText(clip, pick) {
  const map = { with: "🟩", minority: "🟦", split: "🟧" };
  const d = positionFor(clip.diagnose.field, pick.diagnose);
  const a = positionFor(clip.adjust.field, pick.adjust);
  const matched = pick.predict === clip.outcome.actual;
  return ["Cradl · " + catLabel(clip.category), "Predict  " + (matched ? "🎯" : "⬜"), "Diagnose " + map[d.key], "Adjust   " + map[a.key], "🟩 with  🟦 minority  🟧 split", "read the game"].join("\n");
}
function ShareCard({ text, onClose }) {
  const [copied, setCopied] = useState(false);
  const copy = () => { try { navigator.clipboard.writeText(text); } catch (e) {} setCopied(true); };
  return (
    <div className="fixed inset-0 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: PALETTE.panel, borderColor: PALETTE.line }} className="border max-w-sm w-full p-5">
        <pre style={{ color: PALETTE.ink, fontFamily: BODY }} className="text-sm whitespace-pre-wrap mb-4 leading-relaxed">{text}</pre>
        <button onClick={copy} style={{ background: PALETTE.acid, color: PALETTE.bg, fontFamily: DISPLAY }} className="w-full py-2 text-lg tracking-widest">{copied ? "COPIED ✓" : "COPY"}</button>
        <button onClick={onClose} style={{ color: PALETTE.mute }} className="w-full py-2 text-sm mt-1">close</button>
      </div>
    </div>
  );
}

/* ---------- root ---------- */
function Cradl() {
  const [view, setView] = useState("phases"); // phases | list | read
  const [cat, setCat] = useState(null);
  const [clipId, setClipId] = useState(null);
  const [picks, setPicks] = useState({});
  const [showShare, setShowShare] = useState(false);

  const clip = CLIPS.find((c) => c.id === clipId);
  const pick = clip ? picks[clip.id] : null;

  const back = () => {
    if (view === "read") { setView("list"); setClipId(null); }
    else if (view === "list") { setView("phases"); setCat(null); }
  };

  return (
    <div style={{ background: PALETTE.bg, color: PALETTE.ink, fontFamily: BODY, minHeight: "100vh" }}>
      <div className="max-w-2xl mx-auto px-4 py-6">
        <div className="flex items-center justify-between mb-6 pb-4" style={{ borderBottom: "1px solid " + PALETTE.line }}>
          <div className="flex items-center gap-3">
            {view !== "phases" && <button onClick={back} style={{ color: PALETTE.mute }}><ArrowLeft size={18} /></button>}
            <span style={{ fontFamily: DISPLAY, color: PALETTE.acid }} className="text-4xl tracking-wider">CRADL</span>
          </div>
          {cat && <span style={{ color: catColor(cat), fontFamily: DISPLAY }} className="text-lg tracking-wide">{catLabel(cat)}</span>}
        </div>

        {view === "phases" && <Phases onPick={(k) => { setCat(k); setView("list"); }} />}
        {view === "list" && <ClipList cat={cat} picks={picks} onOpen={(id) => { setClipId(id); setView("read"); }} />}
        {view === "read" && clip && !pick && <Read clip={clip} onComplete={(r) => setPicks((s) => Object.assign({}, s, { [clip.id]: r }))} />}
        {view === "read" && clip && pick && <Reveal clip={clip} pick={pick} onShare={() => setShowShare(true)} onBack={back} />}

        {showShare && clip && pick && <ShareCard text={shareText(clip, pick)} onClose={() => setShowShare(false)} />}

        <div className="mt-10 pt-4 text-xs" style={{ borderTop: "1px solid " + PALETTE.line, color: PALETTE.mute }}>
          Prototype · responses not saved · split bars are seeded illustrative numbers. Predict has a real outcome; diagnose and adjust don't — the disagreement is the point.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Cradl />);
</script>
</body>
</html>
